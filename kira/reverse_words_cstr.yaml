name: "assert reverse_words_cstr('hello world\n') == ('world hello', '')"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [104, 101, 108, 108, 111, 32, 119, 111, 114, 108, 100, 10]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [119,111,114,108,100,32,104,101,108,108,111]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "world hello"
